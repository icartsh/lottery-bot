name: Buy lotto
on:
  schedule:
    # every Monday on 06:17 AM (KST) = Sunday 21:17 UTC.
    # GitHub `schedule` is best-effort and has been firing 3-11 hours late since
    # late Aug 2026. dhlottery online sales are open 06:00-24:00 KST only, so the
    # cron sits at the very start of that window: a delay of up to ~17h40m still
    # lands inside sales hours instead of after midnight, where the buy fails.
    # Sunday-night UTC is also a low-load slot compared with Monday 10:17 UTC.
    - cron: 17 21 * * 0
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    name: Buy lotto
    steps:  

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # caching pip dependencies
      - run: pip install -r requirements.txt
      
      - name: Run Scripts
        run: make buy # or use 'make buy_lotto' / 'make buy_win720' for granular purchase
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: ${{ secrets.COUNT }}
          MANUAL_NUMBERS: ${{ secrets.MANUAL_NUMBERS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}