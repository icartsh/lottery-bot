name: Schedule Test
# Temporary diagnostic: verifies that GitHub delivers `schedule` events to this
# repository at all. Does not log in or touch the lottery site. Delete once the
# scheduled runs are confirmed working.
on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: [ubuntu-latest]
    name: Ping
    steps:
      - name: Report trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u '+%F %T %a')"
          echo "kst=$(TZ=Asia/Seoul date '+%F %T %a')"
